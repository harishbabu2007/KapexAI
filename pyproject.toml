# ./pyproject.toml
[project]
name = "kapex-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "services/database",
    "services/redis-service",
    "backend",
    "worker",
]

[dependency-groups]
dev = [
    "fastapi[standard]>=0.139.2",
    "prisma==0.15.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "wsproto>=1.2.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
