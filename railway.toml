[build]
builder = "DOCKERFILE"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[services]]
name = "backend"
dockerfilePath = "Dockerfile.backend"
healthcheckPath = "/health"

[[services]]
name = "worker"
dockerfilePath = "Dockerfile.worker"