# ./backend/pyproject.toml
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "db-service",
    "redis-service",
    "python-jose>=3.5.0",
    "httpx>=0.28.1",
]

[tool.uv.sources]
db-service = { workspace = true }
redis-service = { workspace = true }

[tool.setuptools.packages.find]
include = ["backend*"]
